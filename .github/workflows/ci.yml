name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  dashboard:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: ci-root
          MYSQL_DATABASE: serverwatch_test
          MYSQL_USER: serverwatch
          MYSQL_PASSWORD: ci-password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -pci-root --silent"
          --health-interval=10s --health-timeout=5s --health-retries=10
    env:
      # Throwaway CI database; tests refuse to run against any name not ending in _test.
      DB_HOST: 127.0.0.1
      DB_PORT: "3306"
      DB_NAME: serverwatch_test
      DB_TEST_NAME: serverwatch_test
      DB_USER: serverwatch
      DB_PASSWORD: ci-password
    defaults:
      run:
        working-directory: dashboard
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          extensions: pdo_mysql, sodium
          tools: composer:v2
          coverage: none
      - run: composer install --no-interaction --no-progress
      - run: composer lint
      - run: composer stan
      - run: composer test

  go:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        component: [ingestion, agent]
    defaults:
      run:
        working-directory: ${{ matrix.component }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
      - run: test -z "$(gofmt -l .)"
      - run: go vet ./...
      - run: go test ./...
      - run: go build ./...

  compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker compose -f deploy/docker-compose.dev.yml config --quiet
        env:
          MYSQL_ROOT_PASSWORD: ci
          MYSQL_PASSWORD: ci
          REDIS_PASSWORD: ci
